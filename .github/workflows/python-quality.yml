# Generated from config/python-quality-workflows.toml.
# Edit the manifest, then run scripts/python_quality_workflows.py render.
name: Python quality

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validate clone-local Ruff contract
        run: uv run --no-project python .github/scripts/check_ruff_contract.py
      - name: Ruff correctness gate
        run: >-
          uvx --from ruff==0.15.22 ruff check --select E9,F63,F7,F82 .
